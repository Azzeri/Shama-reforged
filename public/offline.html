<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EC">
    <title>Shama</title>
    <style>
        html, body { margin: 0; height: 100%; background: #F7F3EC; color: #1F1B16; }
        body {
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
            box-sizing: border-box;
        }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-family: ui-serif, Georgia, serif; font-size: 24px; margin: 20px 0 8px; }
        p { margin: 0 0 24px; color: rgba(43, 33, 24, .6); font-size: 15px; }
        button {
            border: 0; border-radius: 16px; padding: 14px 28px; background: #B13F27; color: #fff;
            font: inherit; font-weight: 800; font-size: 15px;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You are offline</h1>
        <p>Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
